name: Release

# Triggered when you push a version tag: git tag v1.0.0 && git push --tags
# Creates a GitHub Release with:
#   - capture-windows-x64.zip   (capture.exe + DLLs)
#   - preview-windows-x64.zip   (preview.exe + DLLs)
#   - Docker image tagged with the version in GHCR

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Build capture ────────────────────────────────────────────────────────────
  capture:
    name: Build capture (Windows x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Expose GHA cache to vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL',    process.env.ACTIONS_CACHE_URL)
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)

      - name: Setup vcpkg
        run: |
          git clone --depth=1 https://github.com/microsoft/vcpkg C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat -disableMetrics
        shell: cmd

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: vcpkg-win-${{ hashFiles('capture/vcpkg.json') }}
          restore-keys: vcpkg-win-

      - name: Configure & build
        working-directory: capture
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build --config Release --parallel
        shell: pwsh

      - name: Zip artifact
        run: Compress-Archive -Path capture/build/Release/* -DestinationPath capture-windows-x64.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: capture-zip
          path: capture-windows-x64.zip

  # ── Build preview ────────────────────────────────────────────────────────────
  preview:
    name: Build preview (Windows x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Expose GHA cache to vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL',    process.env.ACTIONS_CACHE_URL)
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)

      - name: Setup vcpkg
        run: |
          git clone --depth=1 https://github.com/microsoft/vcpkg C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat -disableMetrics
        shell: cmd

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: vcpkg-win-preview-${{ hashFiles('preview/CMakeLists.txt') }}
          restore-keys: vcpkg-win-preview-

      - name: Install preview deps & build
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          C:/vcpkg/vcpkg install glfw3:x64-windows glew:x64-windows
          cmake -B preview/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -S preview
          cmake --build preview/build --config Release --parallel
        shell: pwsh

      - name: Zip artifact
        run: Compress-Archive -Path preview/build/Release/* -DestinationPath preview-windows-x64.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: preview-zip
          path: preview-windows-x64.zip

  # ── Build & push server Docker image ─────────────────────────────────────────
  server-docker:
    name: Build server Docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta (extract tag name)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/holovisualize-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login and push are disabled until a GHCR repository is set up.
      # To enable: uncomment the login step and set push: true below.
      # - name: Login to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Create GitHub Release ────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [capture, preview, server-docker]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download capture zip
        uses: actions/download-artifact@v4
        with:
          name: capture-zip

      - name: Download preview zip
        uses: actions/download-artifact@v4
        with:
          name: preview-zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Holovisualize ${{ github.ref_name }}
          body: |
            ## Holovisualize ${{ github.ref_name }}

            ### Downloads

            | File | Description |
            |---|---|
            | `capture-windows-x64.zip` | Capture client — run on the machine with the Kinect |
            | `preview-windows-x64.zip` | Preview window — connect to server as a viewer |

            ### Server (Docker)

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/holovisualize-server:${{ github.ref_name }}
            docker run -p 8080:8080 -p 8081:8081/udp -p 8082:8082 \
              ghcr.io/${{ github.repository_owner }}/holovisualize-server:${{ github.ref_name }}
            ```

            Or with docker compose — update the image tag in `docker-compose.yml` and run:
            ```bash
            docker compose up
            ```

            ### Quick start

            1. Start the server (Docker above)
            2. Run `capture.exe localhost:8080 demo sensor0`
            3. Open `http://localhost:8082` for the dashboard
            4. Run `preview.exe` to see the live mesh
          files: |
            capture-windows-x64.zip
            preview-windows-x64.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
