<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Holovisualize AR</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
        #camera-feed { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #gl-canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }

        #start-overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 16px;
            background: #000; color: #fff; text-align: center; padding: 24px; z-index: 10;
        }
        #start-overlay h1 { font-size: 1.3rem; font-weight: 600; margin: 0; }
        #start-overlay p { font-size: 0.85rem; color: #9ca3af; margin: 0; max-width: 320px; }
        #start-btn {
            margin-top: 8px; padding: 14px 32px; font-size: 1rem; font-weight: 600;
            background: #3b82f6; color: #fff; border: none; border-radius: 999px;
        }
        #start-btn:active { background: #2563eb; }

        #hint {
            position: fixed; left: 0; right: 0; bottom: 28px; text-align: center;
            color: #fff; font-size: 0.85rem; text-shadow: 0 1px 4px rgba(0,0,0,.8);
            pointer-events: none; transition: opacity .4s;
        }
        #status {
            position: fixed; top: 12px; left: 12px; right: 12px;
            color: #fff; font-size: 0.7rem; font-family: monospace;
            text-shadow: 0 1px 4px rgba(0,0,0,.8); pointer-events: none;
        }
    </style>
</head>
<body>
    <video id="camera-feed" autoplay muted playsinline></video>
    <canvas id="gl-canvas"></canvas>
    <div id="status"></div>
    <div id="hint" style="opacity:0"></div>

    <div id="start-overlay">
        <h1>Holovisualize AR</h1>
        <p>Precisa de acesso à câmera e ao sensor de orientação do celular.</p>
        <button id="start-btn">Toque para começar</button>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
